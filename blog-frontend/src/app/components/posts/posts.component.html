<div class="posts-container">
  <div class="posts-header">
    <h1>Blog Posts</h1>
    <p>Discover amazing content from our community</p>
    
    <div class="posts-actions">
      <button mat-raised-button color="primary" routerLink="/posts/create">
        <mat-icon>add</mat-icon>
        Create New Post
      </button>
    </div>
  </div>

  <div class="posts-content">
    <!-- Search and Filter Section -->
    <mat-card class="search-card">
      <mat-card-content>
        <div class="search-section">
          <mat-form-field appearance="outline" class="search-field">
            <mat-label>Search posts</mat-label>
            <input matInput placeholder="Search by title or content...">
            <mat-icon matSuffix>search</mat-icon>
          </mat-form-field>
          
          <mat-form-field appearance="outline" class="filter-field">
            <mat-label>Filter by category</mat-label>
            <mat-select>
              <mat-option value="all">All Categories</mat-option>
              <mat-option value="technology">Technology</mat-option>
              <mat-option value="lifestyle">Lifestyle</mat-option>
              <mat-option value="travel">Travel</mat-option>
              <mat-option value="food">Food</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- Posts Grid -->
    <div class="posts-grid">
      <!-- Sample Post Cards -->
      <mat-card class="post-card" *ngFor="let post of samplePosts">
        <mat-card-header>
          <div mat-card-avatar class="author-avatar">
            <mat-icon>person</mat-icon>
          </div>
          <mat-card-title>{{ post.title }}</mat-card-title>
          <mat-card-subtitle>By {{ post.author }} • {{ post.date }}</mat-card-subtitle>
        </mat-card-header>
        
        <mat-card-content>
          <p class="post-excerpt">{{ post.excerpt }}</p>
          <div class="post-tags">
            <mat-chip-listbox>
              <mat-chip *ngFor="let tag of post.tags">{{ tag }}</mat-chip>
            </mat-chip-listbox>
          </div>
        </mat-card-content>
        
        <mat-card-actions>
          <button mat-button color="primary">Read More</button>
          <button mat-icon-button>
            <mat-icon>favorite_border</mat-icon>
          </button>
          <button mat-icon-button>
            <mat-icon>share</mat-icon>
          </button>
        </mat-card-actions>
      </mat-card>
    </div>

    <!-- Load More Button -->
    <div class="load-more-section">
      <button mat-raised-button color="accent" class="load-more-btn">
        Load More Posts
      </button>
    </div>
  </div>
</div>
