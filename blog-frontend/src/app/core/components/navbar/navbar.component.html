<mat-toolbar color="primary" class="navbar">
  <!-- Mobile Menu Button -->
  <button
    type="button"
    aria-label="Toggle sidenav"
    mat-icon-button
    (click)="onToggleSidenav()"
    *ngIf="isHandset$ | async"
    class="menu-button">
    <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
  </button>

  <!-- Logo/Brand -->
  <div class="brand-section">
    <mat-icon class="brand-icon">article</mat-icon>
    <span class="brand-text">Blog Platform</span>
  </div>

  <!-- Desktop Navigation -->
  <div class="desktop-nav" *ngIf="!(isHandset$ | async)">
    <a mat-button 
       *ngFor="let item of navItems" 
       [routerLink]="item.route"
       routerLinkActive="active"
       class="nav-link">
      <mat-icon>{{ item.icon }}</mat-icon>
      <span>{{ item.name }}</span>
    </a>
  </div>

  <!-- Spacer -->
  <span class="spacer"></span>

  <!-- User Section -->
  <div class="user-section">
    <!-- Login Button (when not logged in) -->
    <button mat-raised-button 
            color="accent" 
            *ngIf="!isLoggedIn"
            (click)="onLogin()"
            class="login-button">
      <mat-icon>login</mat-icon>
      <span>Login</span>
    </button>

    <!-- User Menu (when logged in) -->
    <div *ngIf="isLoggedIn" class="user-menu">
      <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-button">
        <mat-icon>account_circle</mat-icon>
      </button>
      
      <mat-menu #userMenu="matMenu" class="user-dropdown">
        <button mat-menu-item *ngFor="let item of userMenuItems" (click)="handleUserAction(item)">
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.name }}</span>
        </button>
      </mat-menu>
    </div>
  </div>
</mat-toolbar>
